  :root{
    --pakete-navy:#194a72;
    --pakete-navy-deep:#0f3454;
    --pakete-blue:#1e8ac6;
    --log-dark:#0a1826;
    --log-mid:#132a3f;
    --log-platinum:#c7d4e0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    overflow:hidden;
  }
  @keyframes pageFadeIn{from{opacity:0}to{opacity:1}}
  body{ animation: pageFadeIn 0.5s ease both; }
  @media (prefers-reduced-motion: reduce){ body{ animation:none; } }

  .split{
    display:flex;
    height:100vh;
    width:100vw;
    position:relative;
  }
  .half{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: flex 0.6s cubic-bezier(.22,.9,.3,1), filter 0.5s ease;
    overflow:hidden;
    text-decoration:none;
  }
  .half, .half *{ text-decoration:none; }
  /* natpis MOVE ON u svakoj polovini, dok se nista ne hoveruje */
  .half::before{
    content:"Move On";
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    position:absolute;
    top:96px;
    left:50%;
    transform: translateX(-50%);
    z-index:3;
    font-size:19px;
    letter-spacing:9px;
    text-transform:uppercase;
    font-weight:600;
    white-space:nowrap;
    pointer-events:none;
    transition: opacity 0.4s ease;
  }
  .pakete::before{ color:#4b5f6d; }
  .logistics::before{ color: var(--log-platinum); opacity:0.75; }
  /* na hover oba natpisa nestaju, izlazi logo */
  .split:hover .half::before{ opacity:0; }
  .half::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.09), transparent 60%);
    opacity:0;
    transition: opacity 0.6s ease;
    pointer-events:none;
  }
  .half:hover::after{ opacity:1; }

  .pakete{
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(30,138,198,0.13) 0%, transparent 62%),
      linear-gradient(to bottom, #ffffff 0%, #f4f6f8 45%, #e7eef4 100%);
    color:#16222d;
  }
  .logistics{
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(199,212,224,0.10) 0%, transparent 62%),
      linear-gradient(to bottom, var(--log-dark) 0%, var(--log-mid) 35%, var(--log-mid) 72%, var(--log-dark) 100%);
    color: var(--log-platinum);
    box-shadow: -16px 0 44px rgba(10,24,38,0.30);
  }

  .split:hover .half{ filter: brightness(0.62) saturate(0.85); }
  .split:hover .pakete{ filter: brightness(0.94) saturate(0.9); }
  .split .half:hover{ flex: 1.22; filter: brightness(1) saturate(1); }

  .half-inner{
    position:relative;
    z-index:2;
    text-align:center;
    max-width:460px;
    padding: 0 36px;
    transition: transform 0.6s cubic-bezier(.22,.9,.3,1);
  }
  .half:hover .half-inner{ transform: scale(1.045); }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:10px;
    letter-spacing:3px;
    font-size:12px;
    text-transform:uppercase;
    opacity:0.8;
    margin-bottom:22px;
  }
  .kicker::before, .kicker::after{
    content:"";
    width:22px;
    height:1px;
    background: currentColor;
    opacity:0.5;
    display:block;
  }
  .pakete .kicker{ color: var(--pakete-navy); }
  .logistics .kicker{ color: var(--log-platinum); }

  h1.headline{
    font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
    font-size:44px;
    line-height:1.1;
    margin:0 0 20px 0;
    font-weight:700;
    letter-spacing:-0.5px;
    min-height:100px;
  }
  .logistics h1.headline{
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:600;
    font-size:33px;
  }
  .sub{
    font-size:16px;
    line-height:1.55;
    margin:0 0 36px 0;
    font-weight:300;
    min-height:50px;
  }
  .pakete .sub{ color:#4b5f6d; }
  .logistics .sub{ opacity:0.85; }

  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:15px 32px;
    border-radius:4px;
    font-size:13px;
    font-weight:600;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition: transform 0.3s ease, gap 0.3s ease, background 0.3s ease, border-color 0.3s ease;
  }
  .pakete .btn{
    background: var(--pakete-navy);
    color:#ffffff;
  }
  .logistics .btn{
    background: transparent;
    color: var(--log-platinum);
    border:1px solid rgba(199,212,224,0.45);
  }
  .btn .arrow{ transition: transform 0.3s ease; }
  .half:hover .btn{ gap:16px; }
  .btn:hover .arrow{ transform: translateX(4px); }
  .pakete .btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(15,52,84,0.28);
  }
  .logistics .btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(0,0,0,0.38);
    background: rgba(199,212,224,0.14);
  }

  /* logo unutar polovine -- koristi se samo na telefonu */
  .half-logo{ display:none; }

  /* ---------- prelaz pri kliku: jedna strana se siri, druga izlazi ---------- */
  .split.leaving{ pointer-events:none; }
  .split.leaving .half{
    transition: flex 0.7s cubic-bezier(.22,.9,.3,1), filter 0.45s ease;
  }
  .split.leaving .half.go{ filter:none !important; }
  /* sadrzaj kliknute strane se polako istopi, ostaje cista pozadina */
  .split.leaving .half.go .half-inner{
    opacity:0;
    transform: scale(1.06);
    transition:
      opacity 0.55s ease 0.12s,
      transform 0.75s cubic-bezier(.22,.9,.3,1);
  }
  .split.leaving .half:not(.go) .half-inner{
    opacity:0;
    transition: opacity 0.4s ease;
  }
  .split.leaving .badge-wrap{
    opacity:0 !important;
    transition: opacity 0.45s ease;
  }
  .split.leaving .half::before{ opacity:0 !important; }

  /* prelaz na dodir: pozadina izabrane strane preplavi ekran */
  .leave-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.5s ease;
  }
  .leave-overlay.on{ opacity:1; }
  .ov-light{
    background: linear-gradient(to bottom, #ffffff 0%, #f4f6f8 45%, #e7eef4 100%);
  }
  .ov-dark{
    background: linear-gradient(to bottom, var(--log-dark) 0%, var(--log-mid) 35%, var(--log-mid) 72%, var(--log-dark) 100%);
  }

  @media (prefers-reduced-motion: reduce){
    .split.leaving .half,
    .split.leaving .half.go .half-inner{ transition:none; }
    .leave-overlay{ transition:none; }
  }

  /* ---------- uredjaji na dodir (nema hovera) ---------- */
  @media (hover: none), (pointer: coarse){
    .badge-wrap{ display:none !important; }
    .half::before{ display:none !important; }
    .half-logo{
      display:block;
      width:74px;
      height:auto;
      margin:0 auto 20px;
    }
    .split .half:hover{ flex:1; }
    .split:hover .half,
    .split:hover .pakete,
    .split .half:hover{ filter:none; }
    .half:hover .half-inner{ transform:none; }
    .half:hover::after{ opacity:0; }
  }

  /* ---------- telefon / tablet ---------- */
  @media (max-width: 860px), (max-aspect-ratio: 13/16){
    body{ overflow:auto; }
    .split{
      flex-direction:column;
      height:auto;
      min-height:100vh;
      width:100%;
    }
    .half{
      flex:none;
      min-height:50vh;
      padding:42px 22px;
    }
    /* bez hover efekata na dodir */
    .split:hover .half,
    .split:hover .pakete,
    .split .half:hover{ filter:none; flex:none; }
    .half:hover .half-inner{ transform:none; }
    .half:hover::after{ opacity:0; }
    .badge-wrap{ display:none !important; }
    .half::before{ display:none !important; }

    .logistics{ box-shadow: 0 -14px 34px rgba(10,24,38,0.30); }

    .half-logo{
      display:block;
      width:74px;
      height:auto;
      margin:0 auto 20px;
    }
    .half-inner{ max-width:none; padding:0; }
    h1.headline{
      font-size:32px;
      min-height:0;
      margin-bottom:14px;
    }
    .logistics h1.headline{ font-size:25px; }
    .sub{
      font-size:15px;
      min-height:0;
      margin-bottom:26px;
    }
    .kicker{
      font-size:11px;
      letter-spacing:2.5px;
      margin-bottom:16px;
    }
    .kicker::before, .kicker::after{ width:16px; }
    .btn{ padding:14px 26px; font-size:12.5px; }
  }

  @media (max-width: 380px){
    h1.headline{ font-size:28px; }
    .logistics h1.headline{ font-size:22px; }
    .half-logo{ width:62px; }
  }
  .pakete:hover .btn{ background: var(--pakete-navy-deep); }
  .logistics:hover .btn{ border-color: var(--log-platinum); background: rgba(199,212,224,0.08); }

  /* ---------- logo: nevidljiv dok ne hoverujes, pa izlazi sa sredine ---------- */
  .badge-wrap{
    position:absolute;
    top:62px;
    left:50%;
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    pointer-events:none;
    opacity:0;
    transform: translateX(-50%) scale(0.82);
    transition:
      transform 0.65s cubic-bezier(.22,.9,.3,1),
      opacity 0.45s ease;
  }
  .split:has(.pakete:hover) .badge-wrap{
    opacity:1;
    transform: translateX(calc(-50% - 22.5vw)) scale(1);
  }
  .split:has(.logistics:hover) .badge-wrap{
    opacity:1;
    transform: translateX(calc(-50% + 22.5vw)) scale(1);
  }

  .badge-wrap img{
    display:block;
    width:142px;
    height:auto;
    transition: opacity 0.4s ease;
  }
  .logo-color{ position:relative; opacity:0; }
  .logo-white{ position:absolute; top:0; left:0; opacity:0; }
  .split:has(.pakete:hover) .logo-color{ opacity:1; }
  .split:has(.logistics:hover) .logo-white{ opacity:1; }

  .brand-footer{
    margin-top:20px;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    white-space:nowrap;
    transition: color 0.4s ease;
    color: transparent;
  }
  .split:has(.pakete:hover) .brand-footer{ color:#4b5f6d; }
  .split:has(.logistics:hover) .brand-footer{ color: var(--log-platinum); }
</style>
</head>

<script>
(function(){
  var split  = document.querySelector('.split');
  var halves = Array.prototype.slice.call(document.querySelectorAll('.half'));
  if(!split) return;

  function manjePokreta(){
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function imaHover(){
    return window.matchMedia('(hover: hover)').matches
        && window.matchMedia('(min-width: 861px)').matches;
  }

  // telefon/tablet: pozadina izabrane strane preplavi ekran
  function prelazPrelivom(half, href){
    var ov = document.createElement('div');
    ov.className = 'leave-overlay ' + (half.classList.contains('pakete') ? 'ov-light' : 'ov-dark');
    document.body.appendChild(ov);
    var inner = half.querySelector('.half-inner');
    if(inner){
      inner.style.transition = 'opacity 0.35s ease';
      inner.style.opacity = '0';
    }
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ ov.classList.add('on'); });
    });
    setTimeout(function(){ window.location.href = href; }, 560);
  }

  halves.forEach(function(half){
    half.addEventListener('click', function(e){
      // otvaranje u novom tabu i "manje pokreta" -- normalno ponasanje
      if(manjePokreta()) return;
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;

      e.preventDefault();
      var href = half.getAttribute('href');

      // uzak ekran / dodir -- preliv umesto sirenja u stranu
      if(!imaHover()){ prelazPrelivom(half, href); return; }

      // fiksiraj trenutne sirine BEZ animacije, da prelaz krene odatle
      var sirine = halves.map(function(x){ return x.getBoundingClientRect().width; });
      halves.forEach(function(x, i){
        x.style.transition = 'none';
        x.style.flex = '0 0 ' + sirine[i] + 'px';
      });
      void split.offsetWidth;
      halves.forEach(function(x){ x.style.transition = ''; });
      void split.offsetWidth;

      split.classList.add('leaving');
      half.classList.add('go');
      halves.forEach(function(x){
        x.style.flex = '0 0 ' + (x === half ? '100%' : '0%');
      });

      setTimeout(function(){ window.location.href = href; }, 820);
    });
  });

  // povratak dugmetom "nazad" -- vrati sve u pocetno stanje
  function resetuj(){
    split.classList.remove('leaving');
    halves.forEach(function(x){
      x.classList.remove('go');
      x.style.flex = '';
      x.style.transition = '';
      var inner = x.querySelector('.half-inner');
      if(inner){ inner.style.opacity = ''; inner.style.transition = ''; }
    });
    var overlays = document.querySelectorAll('.leave-overlay');
    for(var i = 0; i < overlays.length; i++){
      if(overlays[i].parentNode) overlays[i].parentNode.removeChild(overlays[i]);
    }
  }
  window.addEventListener('pageshow', resetuj);
  window.addEventListener('popstate', resetuj);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) resetuj();
  });
})();
</script>
